name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: committed

      - name: Lint commit messages
        run: committed "origin/${{ github.base_ref }}..HEAD"

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format frontmatter-mcp.slnx --verify-no-changes

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore frontmatter-mcp.slnx

      - name: Build
        run: dotnet build frontmatter-mcp.slnx --no-restore -warnaserror

  aot-smoke:
    name: AOT publish smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained AOT binary
        run: >
          dotnet publish src/FrontmatterMCP -c Release -r linux-x64
          --self-contained -p:PublishAot=true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test --project tests/FrontmatterMCP.Tests
