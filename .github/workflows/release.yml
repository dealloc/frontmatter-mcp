name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (creates the tag + GitHub release)'
        required: true
        type: string
  release:
    types: [published]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changelog:
    name: Tag & changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Extract version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A hyphen in the version is a semver pre-release identifier
          # (e.g. v0.1.0-rc.1).
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --github-repo "${{ github.repository }}" \
            --latest --strip all \
            --output RELEASE_NOTES.md

      - name: Build release body
        env:
          EXISTING_BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$EXISTING_BODY" ]; then
            printf '%s\n\n' "$EXISTING_BODY" > RELEASE_BODY.md
          else
            : > RELEASE_BODY.md
          fi
          cat RELEASE_NOTES.md >> RELEASE_BODY.md

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          bodyFile: RELEASE_BODY.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true

  build:
    name: Build (${{ matrix.name }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      # One target failing (e.g. a transient runner issue) must not cancel
      # the others mid-release, which would otherwise leave a published
      # release with a partial, inconsistent artifact set.
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: frontmatter-mcp-linux-x64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: frontmatter-mcp-linux-arm64.tar.gz
          - name: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: frontmatter-mcp-osx-arm64.tar.gz
          - name: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: frontmatter-mcp-osx-x64.tar.gz
          - name: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: frontmatter-mcp-win-x64.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      - name: Toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Stamp version into Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml
          # Keep Cargo.lock's own-package entry in sync so --locked stays
          # usable; dependency versions are untouched.
          sed -i.bak "/^name = \"frontmatter-mcp\"$/{n;s/^version = .*/version = \"${VERSION}\"/;}" Cargo.lock
          rm -f Cargo.toml.bak Cargo.lock.bak
          git --no-pager diff --stat

      - name: Stamp version into .mcp/server.json
        run: |
          jq --arg v "${{ needs.changelog.outputs.version }}" \
            '.version = $v | (.packages[] | .version) |= $v' \
            .mcp/server.json > server.json.tmp
          mv server.json.tmp .mcp/server.json

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Codesign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: |
          codesign -s - --force --timestamp=none \
            "target/${{ matrix.target }}/release/frontmatter-mcp"

      - name: Package
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/frontmatter-mcp${{ matrix.ext }}" dist/
          cp LICENSE.md dist/
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd dist && 7z a "../${{ matrix.archive }}" "frontmatter-mcp${{ matrix.ext }}" LICENSE.md)
          else
            tar -czf "${{ matrix.archive }}" -C dist "frontmatter-mcp${{ matrix.ext }}" LICENSE.md
          fi
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload artifact to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.changelog.outputs.tag }}
          artifacts: "${{ matrix.archive }},${{ matrix.archive }}.sha256"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true

      - name: Upload raw binary for mcpb packaging
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/frontmatter-mcp${{ matrix.ext }}
          if-no-files-found: error

  package-mcpb:
    name: Package .mcpb bundles
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: linux
          - name: linux-arm64
            platform: linux
          - name: osx-arm64
            platform: darwin
          - name: osx-x64
            platform: darwin
          - name: win-x64
            platform: win32
            ext: .exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: bundle/server

      - name: Render manifest.json
        run: |
          chmod +x "bundle/server/frontmatter-mcp${{ matrix.ext }}"
          sed \
            -e 's/__VERSION__/${{ needs.changelog.outputs.version }}/g' \
            -e 's/__ENTRY__/frontmatter-mcp/g' \
            -e 's/__PLATFORM__/${{ matrix.platform }}/g' \
            packaging/manifest.json.tmpl > bundle/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack .mcpb bundle
        run: |
          npx --yes @modelcontextprotocol/mcpb pack bundle \
            "frontmatter-mcp-${{ matrix.name }}.mcpb"

      - name: Sign .mcpb bundle (self-signed)
        # mcpb bundle signing is application-level tamper-evidence only; it
        # is unrelated to OS code-signing (see the ad-hoc codesign step in
        # the build job). If Claude Desktop's zip parser still rejects
        # signed bundles (modelcontextprotocol/mcpb#278/#281), this step can
        # be dropped and the bundle shipped unsigned.
        run: |
          npx --yes @modelcontextprotocol/mcpb sign --self-signed \
            "frontmatter-mcp-${{ matrix.name }}.mcpb"

      - name: Checksum
        run: shasum -a 256 "frontmatter-mcp-${{ matrix.name }}.mcpb" > "frontmatter-mcp-${{ matrix.name }}.mcpb.sha256"

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: frontmatter-mcp-${{ matrix.name }}.mcpb

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.changelog.outputs.tag }}
          artifacts: "frontmatter-mcp-${{ matrix.name }}.mcpb,frontmatter-mcp-${{ matrix.name }}.mcpb.sha256"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
