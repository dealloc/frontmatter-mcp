[package]
name = "frontmatter-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/dealloc/frontmatter-mcp"
description = "An MCP server that reads only the YAML frontmatter of markdown documents, without loading the document body."
keywords = ["mcp", "markdown", "frontmatter", "yaml", "stdio"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "frontmatter_mcp"
path = "src/lib.rs"

[[bin]]
name = "frontmatter-mcp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.rustdoc]
private_intra_doc_links = "allow"

[lints.clippy]
pedantic = "warn"
suspicious = "warn"
complexity = "warn"
missing_docs_in_private_items = "warn"
module_name_repetitions = "warn"
semicolon_if_nothing_returned = "warn"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
inherits = "dev"
opt-level = 0
codegen-units = 256
debug-assertions = true
overflow-checks = true
incremental = true

[profile.fast.package."*"]
opt-level = 0
